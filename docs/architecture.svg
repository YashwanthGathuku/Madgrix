<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1080" width="760" height="1080" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"><rect x="0" y="0" width="760" height="1080" fill="#ffffff" rx="12" /><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569" /></marker></defs><text x="380" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Verdict Seam — system architecture</text><text x="380" y="62" text-anchor="middle" font-size="13" fill="#64748b">Five trust zones. Arrows show the governed path from intent to verifiable history.</text><rect x="30" y="92" width="700" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" /><text x="44" y="116" font-size="12" font-weight="700" fill="#2563eb">① Control plane</text><text x="380" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Intent → task freeze</text><text x="380" y="150" text-anchor="middle" font-size="12" fill="#334155">task_hash pins intent · baseline commit · policy version</text><line x1="380" y1="160" x2="380" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" /><rect x="30" y="182" width="700" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" /><text x="44" y="206" font-size="12" font-weight="700" fill="#2563eb">① Control plane</text><text x="380" y="224" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Work claims + conflict graph</text><text x="380" y="240" text-anchor="middle" font-size="12" fill="#334155">contract conflicts classified GREEN / YELLOW / RED</text><line x1="380" y1="250" x2="380" y2="270" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" /><rect x="30" y="272" width="700" height="66" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2" /><text x="44" y="296" font-size="12" font-weight="700" fill="#d97706">② Contender microVMs</text><text x="380" y="314" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Contender forks</text><text x="380" y="330" text-anchor="middle" font-size="12" fill="#334155">one Firecracker microVM per contender · write token: own fork only</text><line x1="380" y1="340" x2="380" y2="360" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" /><rect x="30" y="362" width="700" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" /><text x="44" y="386" font-size="12" font-weight="700" fill="#2563eb">① Control plane</text><text x="380" y="404" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Queue ingestion</text><text x="380" y="420" text-anchor="middle" font-size="12" fill="#334155">at-least-once, unordered · content-derived event_key · Durable Object dedupe</text><line x1="380" y1="430" x2="380" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" /><rect x="30" y="452" width="700" height="66" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" /><text x="44" y="476" font-size="12" font-weight="700" fill="#7c3aed">③ Evaluation domain</text><text x="380" y="494" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Evaluation domain</text><text x="380" y="510" text-anchor="middle" font-size="12" fill="#334155">admission gates → hidden oracle · tamper → mechanical quarantine</text><line x1="380" y1="520" x2="380" y2="540" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" /><rect x="30" y="542" width="700" height="66" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" /><text x="44" y="566" font-size="12" font-weight="700" fill="#7c3aed">③ Evaluation domain</text><text x="380" y="584" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Blind verifiers</text><text x="380" y="600" text-anchor="middle" font-size="12" fill="#334155">commit → judge anonymized code → reveal · invalid reveal: inadmissible, no retry</text><line x1="380" y1="610" x2="380" y2="630" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" /><rect x="30" y="632" width="700" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" /><text x="44" y="656" font-size="12" font-weight="700" fill="#16a34a">④ Verdict plane</text><text x="380" y="674" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Verdict seam</text><text x="380" y="690" text-anchor="middle" font-size="12" fill="#334155">eligibility AND-gates → objective dominance → blind 2-of-3 vote</text><line x1="380" y1="700" x2="380" y2="720" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" /><rect x="30" y="722" width="700" height="66" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="2" /><text x="44" y="746" font-size="12" font-weight="700" fill="#e11d48">⑤ Promotion service</text><text x="380" y="764" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Exact-state permit</text><text x="380" y="780" text-anchor="middle" font-size="12" fill="#334155">single-use · binds task · baseline · winning tree · destination head</text><line x1="380" y1="790" x2="380" y2="810" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" /><rect x="30" y="812" width="700" height="66" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="2" /><text x="44" y="836" font-size="12" font-weight="700" fill="#e11d48">⑤ Promotion service</text><text x="380" y="854" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Canonical promotion</text><text x="380" y="870" text-anchor="middle" font-size="12" fill="#334155">sole writer · replay → ALREADY_CONSUMED · HEAD moved → permit EXPIRED</text><line x1="380" y1="880" x2="380" y2="900" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" /><rect x="30" y="902" width="700" height="66" rx="10" fill="#ffe4e6" stroke="#e11d48" stroke-width="2" /><text x="44" y="926" font-size="12" font-weight="700" fill="#e11d48">⑤ Promotion service</text><text x="380" y="944" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Attestation + offline verify</text><text x="380" y="960" text-anchor="middle" font-size="12" fill="#334155">in-toto chain, DSSE → promotion.bundle · 8-line transcript → VERIFIED</text><text x="30" y="998" font-size="13" font-weight="700" fill="#0f172a">Trust zones:</text><rect x="140" y="985" width="14" height="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" /><text x="160" y="998" font-size="12" fill="#334155">1 Control plane</text><rect x="297" y="985" width="14" height="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" /><text x="317" y="998" font-size="12" fill="#334155">2 Contender microVMs</text><rect x="489" y="985" width="14" height="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" /><text x="509" y="998" font-size="12" fill="#334155">3 Evaluation domain</text><rect x="30" y="1009" width="14" height="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" /><text x="50" y="1022" font-size="12" fill="#334155">4 Verdict plane</text><rect x="187" y="1009" width="14" height="14" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5" /><text x="207" y="1022" font-size="12" fill="#334155">5 Promotion service</text><text x="380" y="1048" text-anchor="middle" font-size="12" fill="#64748b">Contenders hold fork-scoped tokens only · verifiers hold no repo access.</text><text x="380" y="1066" text-anchor="middle" font-size="12" fill="#64748b">The promotion service is the sole canonical writer.</text></svg>