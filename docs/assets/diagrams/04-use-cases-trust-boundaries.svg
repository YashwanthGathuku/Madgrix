<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#13202c"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4aa8ff"/></marker></defs><rect width="1200" height="675" fill="#0b1118"/><rect width="1200" height="675" fill="url(#g)"/><g font-family="Arial,Segoe UI,sans-serif"><text x="44" y="60" fill="#f4f7fb" font-size="38" font-weight="800">Use cases, actors, and trust boundaries</text><text x="44" y="94" fill="#9eb0c3" font-size="20">Untrusted producers; independently earned authority</text><text x="1150" y="60" fill="#f4f7fb" font-size="18" font-weight="700" text-anchor="end">4 / 6</text></g><g fill="#111b26" stroke-width="2"><rect x="34" y="135" width="260" height="305" rx="16" stroke="#f6821f"/><rect x="370" y="135" width="305" height="305" rx="16" stroke="#4aa8ff"/><rect x="752" y="135" width="414" height="140" rx="16" stroke="#a77bf3"/><rect x="752" y="300" width="414" height="140" rx="16" stroke="#39d98a"/></g><g font-family="Arial,Segoe UI,sans-serif"><text x="58" y="175" fill="#f6821f" font-size="22" font-weight="800">Untrusted producers</text><text x="58" y="215" fill="#f4f7fb" font-size="18" font-weight="700">Parent agent</text><text x="58" y="255" fill="#f4f7fb" font-size="18" font-weight="700">Sub-agents (N)</text><text x="58" y="295" fill="#f4f7fb" font-size="18" font-weight="700">MCP client / IDE</text><text x="58" y="350" fill="#9eb0c3" font-size="15">Produce contender state.</text><text x="58" y="374" fill="#9eb0c3" font-size="15">Never receive canonical write.</text><text x="394" y="175" fill="#4aa8ff" font-size="22" font-weight="800">MADGRIX control plane</text><text x="394" y="217" fill="#f4f7fb" font-size="18">TaskAuthority + runtime</text><text x="394" y="257" fill="#9eb0c3" font-size="15">• authorize and track tasks</text><text x="394" y="286" fill="#9eb0c3" font-size="15">• manage claims and permits</text><text x="394" y="315" fill="#9eb0c3" font-size="15">• orchestrate promotion</text><text x="394" y="344" fill="#9eb0c3" font-size="15">• enforce gates and quarantine</text><text x="394" y="373" fill="#9eb0c3" font-size="15">• sign canonical evidence</text><text x="776" y="175" fill="#a77bf3" font-size="22" font-weight="800">Independent evaluation domain</text><text x="776" y="215" fill="#f4f7fb" font-size="17">exact SHA • hidden gates • blind verifiers</text><text x="776" y="340" fill="#39d98a" font-size="22" font-weight="800">Trusted downstream</text><text x="776" y="380" fill="#f4f7fb" font-size="17">canonical Artifacts repo + signed bundle</text></g><g stroke="#4aa8ff" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M294 280H370"/><path d="M675 205H752"/><path d="M675 370H752"/></g><g fill="#111b26" stroke-width="2"><rect x="34" y="485" width="340" height="125" rx="16" stroke="#4aa8ff"/><rect x="430" y="485" width="340" height="125" rx="16" stroke="#ff5d73"/><rect x="826" y="485" width="340" height="125" rx="16" stroke="#f6821f"/></g><g font-family="Arial,Segoe UI,sans-serif"><text x="58" y="525" fill="#4aa8ff" font-size="20" font-weight="800">Collaborative feature build</text><text x="58" y="560" fill="#f4f7fb" font-size="16">parallel claims → COMPOSED → VERIFIED → PROMOTED</text><text x="454" y="525" fill="#ff5d73" font-size="20" font-weight="800">Cheater / tamper attempt</text><text x="454" y="560" fill="#f4f7fb" font-size="16">eval modification → QUARANTINED → NOT PROMOTED</text><text x="850" y="525" fill="#f6821f" font-size="20" font-weight="800">HEAD moved race</text><text x="850" y="560" fill="#f4f7fb" font-size="16">permit → EXPIRED_HEAD_MOVED → rebase + re-evaluate</text><text x="600" y="650" fill="#9eb0c3" font-size="16" text-anchor="middle">Mandatory gates are non-compensatory • no operator integrity override • quarantine is mechanical • proof verifies offline</text></g></svg>