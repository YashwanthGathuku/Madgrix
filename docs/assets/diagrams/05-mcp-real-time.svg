<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#13202c"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4aa8ff"/></marker></defs><rect width="1200" height="675" fill="#0b1118"/><rect width="1200" height="675" fill="url(#g)"/><g font-family="Arial,Segoe UI,sans-serif"><text x="44" y="60" fill="#f4f7fb" font-size="38" font-weight="800">MCP in real time</text><text x="44" y="94" fill="#9eb0c3" font-size="20">Coding tools interact without gaining canonical authority</text><text x="1150" y="60" fill="#f4f7fb" font-size="18" font-weight="700" text-anchor="end">5 / 6</text></g><g fill="#111b26" stroke-width="2"><rect x="34" y="140" width="220" height="390" rx="16" stroke="#4aa8ff"/><rect x="300" y="140" width="230" height="390" rx="16" stroke="#f6821f"/><rect x="576" y="140" width="270" height="390" rx="16" stroke="#a77bf3"/><rect x="892" y="140" width="274" height="390" rx="16" stroke="#39d98a"/></g><g font-family="Arial,Segoe UI,sans-serif"><text x="58" y="180" fill="#4aa8ff" font-size="22" font-weight="800">Coding tools</text><text x="58" y="225" fill="#f4f7fb" font-size="18">Claude Code</text><text x="58" y="262" fill="#f4f7fb" font-size="18">Cursor</text><text x="58" y="299" fill="#f4f7fb" font-size="18">VS Code</text><text x="58" y="336" fill="#f4f7fb" font-size="18">other MCP clients</text><text x="324" y="180" fill="#f6821f" font-size="22" font-weight="800">/mcp on Workers</text><text x="324" y="225" fill="#f4f7fb" font-size="17">stateless adapter</text><text x="324" y="260" fill="#9eb0c3" font-size="15">same auth</text><text x="324" y="288" fill="#9eb0c3" font-size="15">same core router</text><text x="324" y="316" fill="#9eb0c3" font-size="15">same TaskAuthority</text><text x="324" y="360" fill="#9eb0c3" font-size="15">No second authority plane.</text><text x="600" y="180" fill="#a77bf3" font-size="22" font-weight="800">Seven agent-safe tools</text><g fill="#f4f7fb" font-size="16"><text x="600" y="220">inspect_task</text><text x="600" y="254">inspect_work_graph</text><text x="600" y="288">check_clearance</text><text x="600" y="322">claim_work</text><text x="600" y="356">open_contender</text><text x="600" y="390">read_ledger</text><text x="600" y="424">verify_permit</text></g><text x="916" y="180" fill="#39d98a" font-size="22" font-weight="800">Live loop</text><g fill="#f4f7fb" font-size="16"><text x="916" y="222">1 inspect intent + graph</text><text x="916" y="262">2 claim scoped work</text><text x="916" y="302">3 code / test / commit</text><text x="916" y="342">4 push to contender fork</text><text x="916" y="382">5 Queue updates authority</text><text x="916" y="422">6 inspect updated state</text><text x="916" y="462">7 continue / choose next work</text></g></g><g stroke="#4aa8ff" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M254 335H300"/><path d="M530 335H576"/><path d="M846 335H892"/></g><g font-family="Arial,Segoe UI,sans-serif"><text x="44" y="584" fill="#ff5d73" font-size="18" font-weight="800">Deliberately absent:</text><text x="210" y="584" fill="#f4f7fb" font-size="17">promote • verdict • issue_permit • canonical write • evidence submission • composition authority</text><text x="44" y="628" fill="#9eb0c3" font-size="16">MCP makes governance discoverable to agents; it does not make canonical authority available to them.</text></g></svg>