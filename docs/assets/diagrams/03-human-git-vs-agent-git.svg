<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#13202c"/></pattern></defs><rect width="1200" height="675" fill="#0b1118"/><rect width="1200" height="675" fill="url(#g)"/><g font-family="Arial,Segoe UI,sans-serif"><text x="44" y="60" fill="#f4f7fb" font-size="38" font-weight="800">From human Git to Git for agents</text><text x="44" y="94" fill="#9eb0c3" font-size="20">Why the operating assumptions change</text><text x="1150" y="60" fill="#f4f7fb" font-size="18" font-weight="700" text-anchor="end">3 / 6</text></g><g fill="#111b26" stroke-width="2"><rect x="34" y="140" width="340" height="365" rx="16" stroke="#4aa8ff"/><rect x="430" y="140" width="340" height="365" rx="16" stroke="#ff5d73"/><rect x="826" y="140" width="340" height="365" rx="16" stroke="#39d98a"/></g><g font-family="Arial,Segoe UI,sans-serif"><text x="58" y="182" fill="#4aa8ff" font-size="23" font-weight="800">Human-era Git / GitHub</text><text x="454" y="182" fill="#ff5d73" font-size="23" font-weight="800">Agent-era failure modes</text><text x="850" y="182" fill="#39d98a" font-size="23" font-weight="800">MADGRIX / Git4agents</text><g fill="#f4f7fb" font-size="18" font-weight="600"><text x="58" y="230">• people + pull requests</text><text x="58" y="275">• branch permissions</text><text x="58" y="320">• manual intent review</text><text x="58" y="365">• collisions found late</text><text x="58" y="410">• audit = what changed</text><text x="58" y="455">• reusable actor authority</text><text x="454" y="230">• many concurrent actors</text><text x="454" y="275">• false “done” claims</text><text x="454" y="320">• test / eval tampering</text><text x="454" y="365">• stale baseline / HEAD races</text><text x="454" y="410">• review cannot scale</text><text x="454" y="455">• logs are not proof</text><text x="850" y="230">• WorkClaims + work graph</text><text x="850" y="275">• governed fork crews</text><text x="850" y="320">• independent evaluation</text><text x="850" y="365">• exact-state permit</text><text x="850" y="410">• sole canonical writer</text><text x="850" y="455">• signed offline proof</text></g><text x="600" y="566" fill="#f4f7fb" font-size="25" font-weight="700" text-anchor="middle">Git records what changed.</text><text x="600" y="605" fill="#f6821f" font-size="30" font-weight="800" text-anchor="middle">MADGRIX proves what may become canonical.</text><text x="600" y="642" fill="#9eb0c3" font-size="16" text-anchor="middle">intent → bounded work → evidence → verdict → exact-state authority → canonicalize → prove</text></g></svg>